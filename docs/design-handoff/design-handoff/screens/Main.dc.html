<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>초기 페이지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1318}
a{color:#ECE8E1}a:hover{color:#FFFFFF}
input::placeholder{color:#5C6672}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px 32px; display: flex; flex-direction: column; background: #0F1318; color: #ECE8E1; font-family: 'IBM Plex Sans KR', system-ui, sans-serif">
  <div style="display: flex; align-items: center; gap: 10px; height: 44px">
    <div style="width: 28px; height: 28px; border-radius: 6px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F1318" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5l8 14 8-14"></path></svg>
    </div>
    <span style="font-weight: 600; font-size: 16px; letter-spacing: -0.2px">내전 도우미</span>
  </div>

  <div style="margin-top: 120px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-size: 32px; line-height: 1.25; font-weight: 700; letter-spacing: -0.8px">팀 · 맵 · 공수,<br>링크 하나로 끝.</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #8B949E">티어와 포지션까지 보고 5:5를 나눠요.<br>로그인 없이 방 코드만 공유하면 돼요.</p>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 16px">
    <button style="height: 56px; border: 0; border-radius: 12px; background: {{accent}}; color: #0F1318; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">방 파기</button>

    <div style="display: flex; align-items: center; gap: 12px; color: #5C6672; font-size: 13px">
      <div style="flex: 1; height: 1px; background: #262D36"></div>
      <span>또는 코드로 참가</span>
      <div style="flex: 1; height: 1px; background: #262D36"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="code" style="font-size: 13px; color: #8B949E">방 코드</label>
      <div style="display: flex; gap: 8px">
        <input id="code" maxlength="6" placeholder="ABC123" style="flex: 1; min-width: 0; height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1px solid #262D36; background: #181D24; color: #ECE8E1; font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 4px; text-transform: uppercase; outline: none">
        <button style="height: 56px; padding: 0 20px; border-radius: 12px; border: 1px solid #39424D; background: transparent; color: #ECE8E1; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">참가하기</button>
      </div>
      <p style="margin: 0; font-size: 13px; color: #FF7A85">방을 찾을 수 없어요. 코드를 다시 확인해주세요.</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF4655","options":["#FF4655","#3DD6C4","#F5C451"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF4655' };
  }
}
</script>
</body>
</html>
