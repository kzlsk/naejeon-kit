<!doctype html>
<html lang="ko">
<head>

<x-dc>

<style>
body{margin:0;background:#0F1318}
a{color:#ECE8E1}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 20px; background: #0F1318; color: #ECE8E1; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; letter-spacing: 2px">K7P2QX</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8B949E"><span style="width: 6px; height: 6px; border-radius: 50%; background: #3DD6C4"></span>실시간</span>
    </div>
    <span style="font-size: 13px; color: #8B949E">참가자</span>
  </div>

  <div style="display: flex; gap: 8px">
    <div style="flex: 1; padding: 12px 14px; border-radius: 12px; background: #181D24; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; color: #8B949E">맵</span>
      <span style="font-size: 16px; font-weight: 600">어센트</span>
    </div>
    <div style="flex: 1; padding: 12px 14px; border-radius: 12px; background: #181D24; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; color: #8B949E">공수</span>
      <span style="font-size: 16px; font-weight: 600">팀1 공격 시작</span>

  </div>

  <div style="padding: 16px; border-radius: 14px; border: 1px solid #39424D; display: flex; flex-direction: column; gap: 12px">

      <span style="font-size: 12px; color: #8B949E">내 정보</span>
      <button style="height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #39424D; background: transparent; color: #ECE8E1; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">수정</button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <img src="{{meIcon}}" alt="골드 2" style="width: 36px; height: 36px; object-fit: contain">
      <span style="font-size: 20px; font-weight: 700">철수</span>
      <span style="font-size: 14px; color: #8B949E">골드 2 · 최티 플래 1</span>
    </div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap">
      <span style="padding: 4px 10px; border-radius: 999px; background: #ECE8E1; color: #0F1318; font-size: 12px; font-weight: 600">타격대 · 주력</span>
      <span style="padding: 4px 10px; border-radius: 999px; border: 1px solid #39424D; color: #C9CED4; font-size: 12px">척후대</span>
      <span style="padding: 4px 10px; border-radius: 999px; border: 1px solid #39424D; color: #C9CED4; font-size: 12px">감시자</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; min-height: 0">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px">
      <span style="font-size: 15px; font-weight: 600">멤버</span>
      <span style="font-size: 13px; color: #8B949E">10명</span>
    </div>
    <sc-for list="{{members}}" as="m" hint-placeholder-count="8">
      <div style="display: flex; align-items: center; gap: 12px; height: 52px; border-top: 1px solid #1E242C">
        <span style="flex: 1; font-size: 15px; font-weight: 500">{{m.name}}</span>
        <sc-if value="{{m.icon}}" hint-placeholder-val="{{true}}">
          <img src="{{m.icon}}" alt="" style="width: 24px; height: 24px; object-fit: contain">
        </sc-if>
        <span style="font-size: 13px; color: {{m.tierColor}}">{{m.tier}}</span>
        <span style="width: 64px; text-align: right; font-size: 12px; color: #8B949E">{{m.pos}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

</body>
</html>
