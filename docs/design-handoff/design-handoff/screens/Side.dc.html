<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공수 결과</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1318}
a{color:#ECE8E1}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 16px; background: #0F1318; color: #ECE8E1; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; position: relative">
  <div style="display: flex; align-items: center; height: 44px">
    <span style="font-size: 17px; font-weight: 600">공수</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; color: #8B949E">팀1 시작 진영</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="height: 132px; border-radius: 14px; border: 2px solid {{accent}}; background: #2A1519; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path><path d="M13 19l6-6"></path><path d="M16 16l4 4"></path><path d="M19 21l2-2"></path></svg>
        <span style="font-size: 20px; font-weight: 700">공격</span>
      </div>
      <div style="height: 132px; border-radius: 14px; border: 2px solid #262D36; background: #181D24; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #5C6672">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg>
        <span style="font-size: 20px; font-weight: 700">수비</span>
      </div>
    </div>
    <p style="margin: 4px 0 0; font-size: 16px; font-weight: 600; text-align: center">팀1 공격 / 팀2 수비 시작</p>
  </div>

  <button style="height: 52px; border-radius: 12px; border: 1px solid #39424D; background: transparent; color: #ECE8E1; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">공수 다시 돌리기</button>

  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px">
    <span style="font-size: 13px; color: #8B949E">디코용 미리보기</span>
    <pre style="margin: 0; padding: 16px; border-radius: 12px; background: #181D24; color: #C9CED4; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.65; white-space: pre-wrap">내전 결과
맵: 어센트
팀1 공격 / 팀2 수비 시작

[팀1] (68.0)
- 철수 — 타격대
- 영희 — 척후대
- 민수 — 전략가
- 지훈 — 감시자
- 수진 — 자유

[팀2] (67.5)
- 현우 — 타격대 ...</pre>
  </div>

  <button style="margin-top: auto; height: 56px; border: 0; border-radius: 12px; background: {{accent}}; color: #0F1318; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">디코용 복사</button>

  <div role="status" style="position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; background: #ECE8E1; color: #0F1318; font-size: 14px; font-weight: 600; white-space: nowrap">복사했어요</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF4655","options":["#FF4655","#3DD6C4","#F5C451"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF4655' };
  }
}
</script>
</body>
</html>
