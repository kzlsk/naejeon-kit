<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>팀 짜기 결과</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1318}
a{color:#ECE8E1}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 14px; background: #0F1318; color: #ECE8E1; font-family: 'IBM Plex Sans KR', system-ui, sans-serif">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <span style="font-size: 17px; font-weight: 600">팀 결과</span>
    <span style="font-size: 13px; color: #8B949E">점수 차 0.5</span>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #2A2113; color: #F5C451; font-size: 14px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 3l10 18H2z"></path><path d="M12 10v5"></path><path d="M12 18h.01"></path></svg>
    <span>팀2: 전략가 가능 인원 없음</span>
  </div>

  <sc-for list="{{teams}}" as="t" hint-placeholder-count="2">
    <div style="border-radius: 14px; background: #181D24; overflow: hidden">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #262D36">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.color}}"></span>
          <span style="font-size: 15px; font-weight: 700">{{t.name}}</span>
        </div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; color: {{t.color}}">{{t.score}}</span>
      </div>
      <sc-for list="{{t.players}}" as="p" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; height: 42px; padding: 0 16px; gap: 10px">
          <span style="flex: 1; font-size: 15px">{{p.name}}</span>
          <span style="font-size: 13px; color: {{p.posColor}}; font-weight: {{p.posWeight}}">{{p.pos}}</span>
        </div>
      </sc-for>
    </div>
  </sc-for>

  <div style="margin-top: auto; display: flex; gap: 8px">
    <button style="flex: 1; height: 56px; border-radius: 12px; border: 1px solid #39424D; background: transparent; color: #ECE8E1; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">다시 짜기</button>
    <button style="flex: 1.4; height: 56px; border: 0; border-radius: 12px; background: {{accent}}; color: #0F1318; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">디코용 복사</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF4655","options":["#FF4655","#3DD6C4","#F5C451"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (rows) => rows.map(([name, pos, main]) => ({
      name,
      pos: main ? pos + ' · 주력' : pos,
      posColor: pos.includes('불가') ? '#F5C451' : pos === '자유' ? '#5C6672' : (main ? '#ECE8E1' : '#8B949E'),
      posWeight: main ? 600 : 400
    }));
    return {
      accent: this.props.accent ?? '#FF4655',
      teams: [
        { name: '팀1', score: '68.0', color: '#5AA9FF', players: mk([
          ['철수', '타격대', true], ['영희', '척후대', true], ['민수', '전략가', true], ['지훈', '감시자', false], ['수진', '자유', false]
        ]) },
        { name: '팀2', score: '67.5', color: '#FF9F43', players: mk([
          ['현우', '타격대', true], ['다은', '척후대', false], ['태영', '감시자', true], ['준호', '전략가 · 불가', false], ['서연', '자유', false]
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
